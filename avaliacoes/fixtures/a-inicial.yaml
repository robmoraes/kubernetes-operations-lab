apiVersion: v1
kind: Namespace
metadata:
  name: prova-a
  labels:
    curso: simulado-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: prova-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: busybox:1.37.0
          command: [sh, -c, 'mkdir -p /www; echo api-ok > /www/index.html; exec httpd -f -p 8080 -h /www']
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 25m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: prova-a
spec:
  selector:
    app: api-antiga
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fila
  namespace: prova-a
spec:
  replicas: 1
  selector:
    matchLabels: {app: fila}
  template:
    metadata:
      labels: {app: fila}
    spec:
      nodeSelector:
        curso.example.com/pool: nao-existe
      containers:
        - name: fila
          image: busybox:1.37.0
          command: [sh, -c, 'sleep 3600']
          resources:
            requests: {cpu: 25m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saude
  namespace: prova-a
spec:
  replicas: 1
  selector:
    matchLabels: {app: saude}
  template:
    metadata:
      labels: {app: saude}
    spec:
      containers:
        - name: saude
          image: busybox:1.37.0
          command: [sh, -c, 'mkdir -p /www; echo saudavel > /www/index.html; exec httpd -f -p 8080 -h /www']
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 25m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          readinessProbe:
            httpGet: {path: /, port: 9090}
            periodSeconds: 5
