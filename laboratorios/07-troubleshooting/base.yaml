apiVersion: v1
kind: Namespace
metadata:
  name: curso-incidentes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: curso-incidentes
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: web-incidente}
  template:
    metadata:
      labels: {app: web-incidente}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              if [ "$APP_MODE" = falhar ]; then
                echo 'Falha de treinamento: APP_MODE=falhar' >&2
                exit 42
              fi
              mkdir -p /tmp/www
              echo incidente-resolvido > /tmp/www/index.html
              exec httpd -f -p 8080 -h /tmp/www
          env: [{name: APP_MODE, value: servir}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 3
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: curso-incidentes
spec:
  selector: {app: web-incidente}
  ports: [{port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Pod
metadata:
  name: diagnostico
  namespace: curso-incidentes
  labels: {papel: diagnostico}
spec:
  automountServiceAccountToken: false
  containers:
    - name: diagnostico
      image: busybox:1.37.0
      command: [sh, -c, "sleep 86400"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
