apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: volume-ausente
  namespace: curso-incidentes
spec:
  storageClassName: classe-que-nao-existe
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: Pod
metadata:
  name: espera-volume
  namespace: curso-incidentes
spec:
  automountServiceAccountToken: false
  containers:
    - name: arquivo
      image: busybox:1.37.0
      command: [sh, -c, "sleep 86400"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      volumeMounts: [{name: dados, mountPath: /dados}]
  volumes:
    - name: dados
      persistentVolumeClaim: {claimName: volume-ausente}
