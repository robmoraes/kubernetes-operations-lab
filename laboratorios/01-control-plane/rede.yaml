apiVersion: v1
kind: Namespace
metadata:
  name: curso-rede-inicial
---
apiVersion: v1
kind: Pod
metadata:
  name: rede-worker1
  namespace: curso-rede-inicial
spec:
  nodeSelector:
    kubernetes.io/hostname: worker1
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: http
      image: busybox:1.37.0
      command: ["sh", "-ec", "hostname > /tmp/index.html; exec httpd -f -p 8080 -h /tmp"]
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /
          port: http
        periodSeconds: 2
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: temporario
          mountPath: /tmp
  volumes:
    - name: temporario
      emptyDir:
        sizeLimit: 8Mi
---
