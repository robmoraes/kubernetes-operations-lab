apiVersion: v1
kind: ServiceAccount
metadata:
  name: leitor
  namespace: curso-seguranca
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leitor
  namespace: curso-seguranca
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leitor
  namespace: curso-seguranca
subjects:
  - kind: ServiceAccount
    name: leitor
    namespace: curso-seguranca
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leitor
