apiVersion: v1
kind: Namespace
metadata:
  name: curso-seguranca
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-seguro
  namespace: curso-seguranca
spec:
  replicas: 1
  selector:
    matchLabels: {app: web-seguro}
  template:
    metadata:
      labels: {app: web-seguro}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: busybox:1.37.0
          command: [sh, -c, "mkdir -p /tmp/www; echo seguro > /tmp/www/index.html; exec httpd -f -p 8080 -h /tmp/www"]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: temporario, mountPath: /tmp}]
      volumes:
        - name: temporario
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web-seguro
  namespace: curso-seguranca
spec:
  selector: {app: web-seguro}
  ports: [{port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Pod
metadata:
  name: cliente
  namespace: curso-seguranca
  labels: {papel: cliente}
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: cliente
      image: busybox:1.37.0
      command: [sh, -c, "sleep 86400"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Pod
metadata:
  name: intruso
  namespace: curso-seguranca
  labels: {papel: intruso}
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: intruso
      image: busybox:1.37.0
      command: [sh, -c, "sleep 86400"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
