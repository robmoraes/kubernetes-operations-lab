apiVersion: apps/v1
kind: Deployment
metadata:
  name: arquivo
  namespace: curso-storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: arquivo
  template:
    metadata:
      labels:
        app: arquivo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: arquivo
          image: busybox:1.37.0
          command: [sh, -c, "sleep 86400"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: dados
              mountPath: /dados
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: dados
