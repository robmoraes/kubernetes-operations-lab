apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: curso-eks-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain
---
apiVersion: v1
kind: Namespace
metadata:
  name: curso-eks-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dados
  namespace: curso-eks-storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: curso-eks-gp3
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: leitor
  namespace: curso-eks-storage
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: leitor
      image: busybox:1.37.0
      command: [sh, -c, "while true; do sleep 3600; done"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: dados
          mountPath: /dados
  volumes:
    - name: dados
      persistentVolumeClaim:
        claimName: dados
