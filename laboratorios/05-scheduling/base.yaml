apiVersion: v1
kind: Namespace
metadata:
  name: curso-scheduling
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenda
  namespace: curso-scheduling
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agenda
  template:
    metadata:
      labels:
        app: agenda
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: agenda
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: busybox:1.37.0
          command: [sh, -c, "mkdir -p /tmp/www; echo agenda > /tmp/www/index.html; exec httpd -f -p 8080 -h /tmp/www"]
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 50m, memory: 16Mi}
            limits: {cpu: 500m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: agenda
  namespace: curso-scheduling
spec:
  selector:
    app: agenda
  ports:
    - port: 80
      targetPort: http
