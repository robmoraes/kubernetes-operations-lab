apiVersion: batch/v1
kind: Job
metadata:
  name: verificar-web
  namespace: curso
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 90
  template:
    metadata:
      labels:
        app: verificar-web
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verificar
          image: busybox:1.37.0
          command: ["sh", "-ec", "wget -T 5 -qO- http://web/healthz"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verificar-web-periodico
  namespace: curso
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  suspend: true # Inicie conscientemente no exercício; não executa ao aplicar.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app: verificar-web
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verificar
              image: busybox:1.37.0
              command: ["sh", "-ec", "wget -T 5 -qO- http://web/healthz"]
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 100m, memory: 32Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
